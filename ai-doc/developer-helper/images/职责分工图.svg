<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820">
  <rect width="1440" height="820" fill="#f6efe4"/>
  <rect x="28" y="28" width="1384" height="764" rx="30" fill="#fffaf0" stroke="#d6c19e" stroke-width="4"/>
  <text x="720" y="86" text-anchor="middle" font-size="36" font-family="Microsoft YaHei, Arial" fill="#5b4632" font-weight="700">AI 与开发人员职责分工</text>
  <text x="720" y="122" text-anchor="middle" font-size="19" font-family="Microsoft YaHei, Arial" fill="#9a7858">读手册时要先分清：哪些是 AI 执行，哪些需要开发人员手动完成</text>

  <g font-family="Microsoft YaHei, Arial">
    <rect x="120" y="190" width="500" height="450" rx="28" fill="#67c8c3" stroke="#427b78" stroke-width="4"/>
    <text x="370" y="246" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="700">AI 负责</text>
    <text x="170" y="310" font-size="22" fill="#ffffff">1. 分析需求与现有架构</text>
    <text x="170" y="356" font-size="22" fill="#ffffff">2. 提出最小改动方案</text>
    <text x="170" y="402" font-size="22" fill="#ffffff">3. 编写和修改代码</text>
    <text x="170" y="448" font-size="22" fill="#ffffff">4. 整理开发文档、需求文档、流程图</text>
    <text x="170" y="494" font-size="22" fill="#ffffff">5. 发现冲突、指出风险、做开发检查</text>
    <text x="170" y="540" font-size="22" fill="#ffffff">6. 提炼可复用规则并给出候选项</text>
    <text x="170" y="586" font-size="22" fill="#ffffff">7. 按规则补日志、注释和结构拆分</text>

    <rect x="820" y="190" width="500" height="450" rx="28" fill="#f0be66" stroke="#a67740" stroke-width="4"/>
    <text x="1070" y="246" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="700">开发人员负责</text>
    <text x="870" y="310" font-size="22" fill="#ffffff">1. 提供目标、限制、现象和补充说明</text>
    <text x="870" y="356" font-size="22" fill="#ffffff">2. 确认规则、流程和实现方向</text>
    <text x="870" y="402" font-size="22" fill="#ffffff">3. 手动创建 Panel / Prefab / 绑定字段</text>
    <text x="870" y="448" font-size="22" fill="#ffffff">4. 在 Unity 中调整 Layout、材质、参数</text>
    <text x="870" y="494" font-size="22" fill="#ffffff">5. 运行项目并验证实际效果</text>
    <text x="870" y="540" font-size="22" fill="#ffffff">6. 决定哪些经验沉淀为全局规则</text>
    <text x="870" y="586" font-size="22" fill="#ffffff">7. 对最终业务效果和可用性拍板</text>

    <line x1="660" y1="415" x2="780" y2="415" stroke="#8a6a49" stroke-width="10"/>
    <polygon points="720,415 696,401 696,429" fill="#8a6a49"/>
    <polygon points="720,415 744,401 744,429" fill="#8a6a49"/>

    <text x="720" y="708" text-anchor="middle" font-size="21" fill="#6d543d">原则：AI 负责“分析、设计、实现、整理”；开发人员负责“确认、创建、调整、验证”。</text>
  </g>
</svg>
