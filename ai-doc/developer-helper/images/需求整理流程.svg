<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820">
  <rect width="1440" height="820" fill="#f6efe4"/>
  <rect x="28" y="28" width="1384" height="764" rx="30" fill="#fffaf0" stroke="#d7c29f" stroke-width="4"/>
  <text x="720" y="86" text-anchor="middle" font-size="36" font-family="Microsoft YaHei, Arial" fill="#5b4732" font-weight="700">需求整理与需求落地流程</text>
  <text x="720" y="122" text-anchor="middle" font-size="19" font-family="Microsoft YaHei, Arial" fill="#9a7858">从几张示意图和主玩法描述，整理到开发可直接使用的规格文档</text>

  <g font-family="Microsoft YaHei, Arial">
    <rect x="80" y="180" width="250" height="110" rx="20" fill="#f0be66" stroke="#a67740" stroke-width="3"/>
    <text x="205" y="226" text-anchor="middle" font-size="25" fill="#ffffff" font-weight="700">原始输入</text>
    <text x="205" y="258" text-anchor="middle" font-size="17" fill="#ffffff">示意图 / 主玩法 / 零散规则</text>

    <rect x="390" y="180" width="270" height="110" rx="20" fill="#67c8c3" stroke="#417a78" stroke-width="3"/>
    <text x="525" y="226" text-anchor="middle" font-size="25" fill="#ffffff" font-weight="700">AI 先搭骨架</text>
    <text x="525" y="258" text-anchor="middle" font-size="17" fill="#ffffff">规则大纲 / 问题清单 / 初版文档</text>

    <rect x="720" y="180" width="270" height="110" rx="20" fill="#7ec95d" stroke="#4f7d3d" stroke-width="3"/>
    <text x="855" y="226" text-anchor="middle" font-size="25" fill="#ffffff" font-weight="700">多轮确认</text>
    <text x="855" y="258" text-anchor="middle" font-size="17" fill="#ffffff">逐步补齐规则、术语、边界</text>

    <rect x="1050" y="180" width="300" height="110" rx="20" fill="#70a0f1" stroke="#486997" stroke-width="3"/>
    <text x="1200" y="226" text-anchor="middle" font-size="25" fill="#ffffff" font-weight="700">同步落文档与草图</text>
    <text x="1200" y="258" text-anchor="middle" font-size="17" fill="#ffffff">md + svg 持续更新</text>

    <rect x="260" y="470" width="300" height="120" rx="22" fill="#d59ce8" stroke="#8a6396" stroke-width="3"/>
    <text x="410" y="522" text-anchor="middle" font-size="26" fill="#ffffff" font-weight="700">开发检查</text>
    <text x="410" y="558" text-anchor="middle" font-size="18" fill="#ffffff">从程序可实现角度检查冲突和缺口</text>

    <rect x="700" y="470" width="460" height="120" rx="22" fill="#e48686" stroke="#995858" stroke-width="3"/>
    <text x="930" y="522" text-anchor="middle" font-size="26" fill="#ffffff" font-weight="700">形成开发可直接使用的规格</text>
    <text x="930" y="558" text-anchor="middle" font-size="18" fill="#ffffff">需求文档 + UI 草图 + 状态机 + 配置结构 + 开发方案</text>

    <line x1="330" y1="235" x2="390" y2="235" stroke="#8a6a49" stroke-width="8"/>
    <polygon points="390,235 368,223 368,247" fill="#8a6a49"/>
    <line x1="660" y1="235" x2="720" y2="235" stroke="#8a6a49" stroke-width="8"/>
    <polygon points="720,235 698,223 698,247" fill="#8a6a49"/>
    <line x1="990" y1="235" x2="1050" y2="235" stroke="#8a6a49" stroke-width="8"/>
    <polygon points="1050,235 1028,223 1028,247" fill="#8a6a49"/>

    <line x1="1200" y1="290" x2="1200" y2="360" stroke="#8a6a49" stroke-width="8"/>
    <line x1="1200" y1="360" x2="410" y2="360" stroke="#8a6a49" stroke-width="8"/>
    <line x1="410" y1="360" x2="410" y2="470" stroke="#8a6a49" stroke-width="8"/>
    <polygon points="410,470 398,448 422,448" fill="#8a6a49"/>

    <line x1="560" y1="530" x2="700" y2="530" stroke="#8a6a49" stroke-width="8"/>
    <polygon points="700,530 678,518 678,542" fill="#8a6a49"/>

    <text x="720" y="700" text-anchor="middle" font-size="20" fill="#6d543d">经验：需求不清时，开发先进入“需求整理模式”，不要直接跳到编码。</text>
  </g>
</svg>
