<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="700" viewBox="0 0 1320 700">
  <rect width="1320" height="700" fill="#f6f0e6"/>
  <rect x="24" y="24" width="1272" height="652" rx="28" fill="#fffaf0" stroke="#d8c5aa" stroke-width="4"/>
  <text x="660" y="78" text-anchor="middle" font-size="34" font-family="Microsoft YaHei, Arial" fill="#5a4531" font-weight="700">显示对象协作流程</text>

  <g font-family="Microsoft YaHei, Arial">
    <rect x="90" y="170" width="250" height="110" rx="20" fill="#69c8c3" stroke="#417a78" stroke-width="3"/>
    <text x="215" y="220" text-anchor="middle" font-size="24" fill="#ffffff" font-weight="700">AI 发现需要显示对象</text>
    <text x="215" y="250" text-anchor="middle" font-size="17" fill="#ffffff">Panel / Prefab / 容器 / 挂点</text>

    <rect x="400" y="170" width="250" height="110" rx="20" fill="#f0bc63" stroke="#a2763e" stroke-width="3"/>
    <text x="525" y="220" text-anchor="middle" font-size="24" fill="#ffffff" font-weight="700">暂停编码</text>
    <text x="525" y="250" text-anchor="middle" font-size="17" fill="#ffffff">先输出创建清单</text>

    <rect x="710" y="170" width="250" height="110" rx="20" fill="#7dc95d" stroke="#4f7d3d" stroke-width="3"/>
    <text x="835" y="220" text-anchor="middle" font-size="24" fill="#ffffff" font-weight="700">开发手动创建</text>
    <text x="835" y="250" text-anchor="middle" font-size="17" fill="#ffffff">并绑定字段 / 组件 / Layout</text>

    <rect x="1020" y="170" width="210" height="110" rx="20" fill="#70a0f1" stroke="#486997" stroke-width="3"/>
    <text x="1125" y="220" text-anchor="middle" font-size="24" fill="#ffffff" font-weight="700">完成回执</text>
    <text x="1125" y="250" text-anchor="middle" font-size="17" fill="#ffffff">“XX 已创建”</text>

    <rect x="430" y="430" width="460" height="120" rx="24" fill="#d59ce8" stroke="#8a6397" stroke-width="3"/>
    <text x="660" y="485" text-anchor="middle" font-size="26" fill="#ffffff" font-weight="700">AI 继续依赖这些对象写代码</text>
    <text x="660" y="520" text-anchor="middle" font-size="18" fill="#ffffff">开始事件绑定、初始化、刷新逻辑和联调</text>

    <line x1="340" y1="225" x2="400" y2="225" stroke="#8a6a49" stroke-width="8"/>
    <polygon points="400,225 378,213 378,237" fill="#8a6a49"/>
    <line x1="650" y1="225" x2="710" y2="225" stroke="#8a6a49" stroke-width="8"/>
    <polygon points="710,225 688,213 688,237" fill="#8a6a49"/>
    <line x1="960" y1="225" x2="1020" y2="225" stroke="#8a6a49" stroke-width="8"/>
    <polygon points="1020,225 998,213 998,237" fill="#8a6a49"/>

    <line x1="1125" y1="280" x2="1125" y2="350" stroke="#8a6a49" stroke-width="8"/>
    <line x1="1125" y1="350" x2="660" y2="350" stroke="#8a6a49" stroke-width="8"/>
    <line x1="660" y1="350" x2="660" y2="430" stroke="#8a6a49" stroke-width="8"/>
    <polygon points="660,430 648,408 672,408" fill="#8a6a49"/>
  </g>
</svg>
