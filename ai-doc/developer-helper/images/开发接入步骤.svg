<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <rect width="1280" height="760" fill="#f4efe5"/>
  <rect x="24" y="24" width="1232" height="712" rx="28" fill="#fff9ef" stroke="#d6c2a0" stroke-width="4"/>
  <text x="640" y="78" text-anchor="middle" font-size="34" font-family="Microsoft YaHei, Arial" fill="#5a4631" font-weight="700">开发接入步骤</text>

  <g font-family="Microsoft YaHei, Arial">
    <rect x="90" y="150" width="280" height="120" rx="20" fill="#67c8c0" stroke="#417b76" stroke-width="3"/>
    <text x="230" y="205" text-anchor="middle" font-size="26" fill="#ffffff" font-weight="700">1. 先看规则</text>
    <text x="230" y="238" text-anchor="middle" font-size="18" fill="#ffffff">prompt.txt / docs/api / 现有源码</text>

    <rect x="500" y="150" width="280" height="120" rx="20" fill="#7fc95d" stroke="#4f7d3d" stroke-width="3"/>
    <text x="640" y="205" text-anchor="middle" font-size="26" fill="#ffffff" font-weight="700">2. 先定方案</text>
    <text x="640" y="238" text-anchor="middle" font-size="18" fill="#ffffff">最小改动、落位、依赖、风险</text>

    <rect x="910" y="150" width="280" height="120" rx="20" fill="#f0bd61" stroke="#a3773d" stroke-width="3"/>
    <text x="1050" y="205" text-anchor="middle" font-size="26" fill="#ffffff" font-weight="700">3. 准备显示对象</text>
    <text x="1050" y="238" text-anchor="middle" font-size="18" fill="#ffffff">需要时先手动创建 Panel / Prefab</text>

    <rect x="180" y="420" width="280" height="120" rx="20" fill="#d59be7" stroke="#8d6598" stroke-width="3"/>
    <text x="320" y="475" text-anchor="middle" font-size="26" fill="#ffffff" font-weight="700">4. 实现代码</text>
    <text x="320" y="508" text-anchor="middle" font-size="18" fill="#ffffff">日志、注释、事件、复用</text>

    <rect x="620" y="420" width="280" height="120" rx="20" fill="#e48787" stroke="#995858" stroke-width="3"/>
    <text x="760" y="475" text-anchor="middle" font-size="26" fill="#ffffff" font-weight="700">5. 联调验证</text>
    <text x="760" y="508" text-anchor="middle" font-size="18" fill="#ffffff">编译、运行、Prefab、交互现象</text>

    <line x1="370" y1="210" x2="500" y2="210" stroke="#8b6a49" stroke-width="8"/>
    <polygon points="500,210 478,198 478,222" fill="#8b6a49"/>
    <line x1="780" y1="210" x2="910" y2="210" stroke="#8b6a49" stroke-width="8"/>
    <polygon points="910,210 888,198 888,222" fill="#8b6a49"/>
    <line x1="1050" y1="270" x2="1050" y2="340" stroke="#8b6a49" stroke-width="8"/>
    <line x1="1050" y1="340" x2="320" y2="340" stroke="#8b6a49" stroke-width="8"/>
    <line x1="320" y1="340" x2="320" y2="420" stroke="#8b6a49" stroke-width="8"/>
    <polygon points="320,420 308,398 332,398" fill="#8b6a49"/>
    <line x1="460" y1="480" x2="620" y2="480" stroke="#8b6a49" stroke-width="8"/>
    <polygon points="620,480 598,468 598,492" fill="#8b6a49"/>

    <text x="640" y="655" text-anchor="middle" font-size="20" fill="#6d543d">先规则，后方案；先显示对象，后依赖代码；先联调，再沉淀经验。</text>
  </g>
</svg>
